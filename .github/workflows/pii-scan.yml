name: PII scan

# Issues, discussions and their comments are public, and this project's main
# rule is that no real mail or credentials go in anything public. This flags
# what looks like personal data or a credential in a new or edited issue,
# discussion or comment: it adds the `needs-redaction` label and asks the
# author, once, to edit it. It can't prevent a post, only catch it quickly, and
# it can be wrong; names, subjects and message text can't be detected. The
# comment names the kinds of thing found, never the text, so the warning
# doesn't repeat it.
#
# The text is only read from the event file by a script: it is never put in a
# shell command, and nothing from the repository is checked out. Pull requests
# are left to review. Issues are labelled and answered through the REST API,
# discussions through GraphQL, the only API that can do either for them.

on:
  issues:
    types: [opened, edited]
  issue_comment: # zizmor: ignore[dangerous-triggers] nothing is checked out or run from it
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions:
  issues: write # label and answer issues; create the label
  discussions: write # label and answer discussions

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look for personal data and credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          LABEL = "needs-redaction"
          MARKER = "<!-- pii-scan -->"

          # Addresses that are placeholders, not people (RFC 2606 / 6761 names).
          PLACEHOLDER = re.compile(
              r"(^|\.)(example\.(com|org|net)|users\.noreply\.github\.com|noreply\.github\.com)$"
              r"|\.(example|test|invalid|localhost)$",
              re.I,
          )
          EMAIL = re.compile(r"[A-Za-z0-9._%+-]+@([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)")
          PATTERNS = {
              "a Google OAuth access token": re.compile(r"\bya29\.[0-9A-Za-z_-]{20,}"),
              "a Google OAuth refresh token": re.compile(r"(?<![\w/])1//[0-9A-Za-z_-]{20,}"),
              "an OAuth client secret": re.compile(r"\bGOCSPX-[0-9A-Za-z_-]{16,}|\"client_secret\"\s*:"),
              "an OAuth token field": re.compile(r"\"(refresh|access)_token\"\s*:"),
              "an OAuth client ID": re.compile(r"\b\d{8,}-[a-z0-9]{8,}\.apps\.googleusercontent\.com"),
              "a Google API key": re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b"),
              "a private key": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "a home folder with a user name": re.compile(
                  r"(?:/Users/|/home/|[A-Za-z]:\\Users\\)(?!(?:user|you|name|username|me|alex)\b)[\w.-]+"
              ),
          }


          def scan(text):
              """What kinds of personal data `text` seems to hold, with counts. Never the matches."""
              found = {}
              emails = [
                  m
                  for m in EMAIL.finditer(text or "")
                  if not PLACEHOLDER.search(m.group(1))
                  and m.group(0).split("@")[0].lower() not in ("git", "noreply", "no-reply")
              ]
              if emails:
                  found["an email address that is not a placeholder"] = len(emails)
              for kind, pattern in PATTERNS.items():
                  hits = pattern.findall(text or "")
                  if hits:
                      found[kind] = len(hits)
              return found


          def target(event):
              """
              (kind, number, node ID, where, text, url) of the post an event is about, or
              None for a pull request or a bot. kind is "issue" or "discussion".
              """
              kind = "discussion" if "discussion" in event else "issue"
              thread = event[kind]
              if "pull_request" in thread:
                  return None  # pull requests are reviewed before anything is merged
              comment = event.get("comment")
              if (comment or thread)["user"]["type"] == "Bot":
                  return None
              if comment:
                  where, text, url = "a comment", comment["body"], comment["html_url"]
              else:
                  where = f"the {kind}"
                  text, url = f"{thread['title']}\n{thread['body'] or ''}", thread["html_url"]
              return kind, thread["number"], thread["node_id"], where, text, url


          def api(method, path, body=None):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=None if body is None else json.dumps(body).encode(),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def graphql(query, **variables):
              result = api("POST", "/graphql", {"query": query, "variables": variables})
              if result.get("errors"):
                  raise RuntimeError(f"GraphQL: {result['errors']}")
              return result["data"]


          def label_and_ask(kind, repo, number, node_id, label_id, body):
              """Add the label, and the comment unless one was posted before."""
              if kind == "issue":
                  api("POST", f"/repos/{repo}/issues/{number}/labels", {"labels": [LABEL]})
                  comments, page = [], 1
                  while chunk := api(
                      "GET", f"/repos/{repo}/issues/{number}/comments?per_page=100&page={page}"
                  ):
                      comments += [c["body"] for c in chunk]
                      page += 1
                  if not any(MARKER in c for c in comments):
                      api("POST", f"/repos/{repo}/issues/{number}/comments", {"body": body})
                  return
              graphql(
                  "mutation($id: ID!, $label: ID!) { addLabelsToLabelable("
                  "input: {labelableId: $id, labelIds: [$label]}) { clientMutationId } }",
                  id=node_id,
                  label=label_id,
              )
              comments, after = [], None
              while True:
                  page = graphql(
                      "query($id: ID!, $after: String) { node(id: $id) { ... on Discussion {"
                      " comments(first: 100, after: $after) { nodes { body }"
                      " pageInfo { hasNextPage endCursor } } } } }",
                      id=node_id,
                      after=after,
                  )["node"]["comments"]
                  comments += [c["body"] for c in page["nodes"]]
                  if not page["pageInfo"]["hasNextPage"]:
                      break
                  after = page["pageInfo"]["endCursor"]
              if not any(MARKER in c for c in comments):
                  graphql(
                      "mutation($id: ID!, $body: String!) { addDiscussionComment("
                      "input: {discussionId: $id, body: $body}) { clientMutationId } }",
                      id=node_id,
                      body=body,
                  )


          def main():
              with open(os.environ["GITHUB_EVENT_PATH"]) as fh:
                  event = json.load(fh)
              post = target(event)
              if post is None:
                  return
              kind, number, node_id, where, text, url = post
              found = scan(text)
              if not found:
                  return

              repo = os.environ["GITHUB_REPOSITORY"]
              try:
                  label = api("POST", f"/repos/{repo}/labels", {"name": LABEL, "color": "d93f0b",
                      "description": "May contain personal data or credentials; edit it out"})
              except urllib.error.HTTPError:
                  label = api("GET", f"/repos/{repo}/labels/{LABEL}")  # it exists
              kinds = "\n".join(f"- {what} ({n})" for what, n in found.items())
              label_and_ask(kind, repo, number, node_id, label["node_id"], f"""{MARKER}
          This looks like it may contain personal data or credentials, in {where} ({url}):

          {kinds}

          Issues and discussions are public. Please edit it to replace real addresses, names, paths and tokens with
          placeholders (`alex@example.com`), or describe the problem by its structure. This is an
          automatic check and can be wrong; if everything in it is a placeholder, ignore this.

          Editing hides the text from the page, but the earlier version stays visible in the edit
          history, so a maintainer may delete the comment or post instead. If a token or
          `client_secrets.json` was posted, revoke it now: see
          [SECURITY.md](https://github.com/{repo}/blob/main/SECURITY.md#if-a-token-may-have-leaked).

          ---
          _Generated by an automatic check in `.github/workflows/pii-scan.yml`_""")


          if __name__ == "__main__":
              main()
          PY
