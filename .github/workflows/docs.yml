name: Docs

# The documentation site, https://mailcellar.github.io/mailcellar/, built
# from docs/ and mkdocs.yml. Pull requests build it (strict: a broken link or
# a page missing from the nav fails); pushes to main also deploy it to GitHub
# Pages. MkDocs is a build tool here, not a dependency of mailcellar: uvx runs
# the pinned versions, and --exclude-newer keeps their own dependencies to
# releases older than that date.

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false # never cut off a deployment halfway

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build the site
        run: >-
          uvx --exclude-newer 2026-10-11 --from mkdocs==1.6.1
          --with mkdocs-material==9.7.7 mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # deploy to Pages
      id-token: write # prove the deployment comes from this workflow
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
